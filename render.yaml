# Render Blueprint. Connect this repo as a Blueprint and the service is created
# in one action. Edit envVars before applying.
services:
  - type: web
    name: riff-api
    runtime: docker
    rootDir: riff
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: riff-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8080"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://riff-dmq0.onrender.com
      - key: YTDLP_PATH
        value: /usr/local/bin/yt-dlp
      - key: YTDLP_COOKIES_FILE
        value: /data/yt-cookies.txt
      - key: YTDLP_COOKIES_CONTENT
        sync: false
      - key: PROXY_LIST_URL
        value: "" # empty disables rotation; the public list's ~3% yield wasn't worth the network-storm risk on every deploy
      - key: REDIS_URL
        sync: false
      - key: SCRAPER_BACKEND
        value: php
      - key: PHP_SCRAPER_URL
        value: https://docs-kabeersnetwork-kview-app-sta.rf.gd/projects/riff
